<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 技能總覽目錄</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e2ded5;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#a15c00; --warn-soft:#fbefdc;
  --stop:#a33a3a; --stop-soft:#f8e3e3; --chip:#f0ede6; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --ink:#e7e9ec; --muted:#9aa1aa; --line:#30343a;
    --accent:#6fc2a9; --accent-soft:#1e3530; --warn:#e3a54c; --warn-soft:#3a2d18;
    --stop:#e58585; --stop-soft:#3a2222; --chip:#2a2e33; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --ink:#e7e9ec; --muted:#9aa1aa; --line:#30343a;
  --accent:#6fc2a9; --accent-soft:#1e3530; --warn:#e3a54c; --warn-soft:#3a2d18;
  --stop:#e58585; --stop-soft:#3a2222; --chip:#2a2e33; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{padding:20px clamp(16px,2vw,32px) 8px;max-width:1800px;margin:0 auto}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--muted);font-size:.92rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.9rem}
.stat b{font-size:1.1rem;color:var(--accent)}
main{max-width:1800px;margin:0 auto;padding:0 clamp(16px,2vw,32px) 40px}
.bar{background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
#toTop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(12px);z-index:20;padding:10px 20px;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toTop.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:200px;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
button,select{font:inherit;color:inherit}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.filters select{width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.active-filters{margin-top:8px;font-size:.9rem;color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;margin:2px 4px 2px 0;font-size:.82rem;cursor:pointer;border:1px solid transparent}
.chip:hover{border-color:var(--accent)}
.chip.agent{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:bold}
.st-啟用{background:var(--accent-soft);color:var(--accent)}
.st-暫停{background:var(--warn-soft);color:var(--warn)}
.st-待確認{background:var(--warn-soft);color:var(--warn)}
.st-已移除{background:var(--stop-soft);color:var(--stop)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:1.08rem}
.en{color:var(--muted);font-size:.82rem;font-family:Consolas,monospace;word-break:break-all}
.card p{margin:0;font-size:.93rem}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:14px;background:var(--panel);font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
.table-wrap{overflow-x:auto}
.group{margin-top:18px}
.group h2{font-size:1.1rem;margin:0 0 6px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
.group ul{margin:0;padding-left:20px}
.group li{margin:3px 0;cursor:pointer}
.group li:hover{color:var(--accent)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
dialog{border:none;border-radius:16px;padding:0;max-width:720px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dlg-body{padding:12px 18px 18px;max-height:70vh;overflow:auto}
.dlg-body h4{margin:12px 0 2px;font-size:.95rem;color:var(--accent)}
.dlg-body p{margin:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.finder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.finder button{padding:12px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.finder button:hover{border-color:var(--accent)}
.finder b{display:block}
footer{max-width:1800px;margin:0 auto;padding:16px clamp(16px,2vw,32px);color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--stop)}
.btn.small{padding:3px 9px;font-size:.85rem}
#t-state{font-size:.88rem;color:var(--muted);margin-left:4px}
#notice .note,#notice2 .note{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}
.form label{display:block;margin:10px 0 2px;font-weight:bold;font-size:.92rem;color:var(--accent)}
.form input[type=text],.form textarea,.form select,.m-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.form textarea{min-height:64px;resize:vertical}
.form .hint{font-size:.82rem;color:var(--muted);font-weight:normal}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:space-between}
.cat-row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;align-items:center;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px}
.cat-row .cnt{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.cat-row.del{opacity:.45;text-decoration:line-through}
.save-row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.move-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.move-row input{margin-top:6px}
.arrow{color:var(--accent);font-weight:bold}
@media print{.bar,footer,.btn,.tools,#toTop{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>Agent 技能總覽目錄</h1>
  <div class="sub">我所有 agent（共用庫、Claude、Gemini、Codex）可以用的技能，一頁查完。資料更新：<span id="updated">—</span></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="搜尋：中文名、英文名、用途、觸發詞、對象…（例：成語、期中、Wordwall）" autocomplete="off">
      <button class="btn" id="reset" type="button">清除篩選</button>
      <button class="btn" id="theme" type="button" title="切換深淺色">深／淺色</button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="filters">
      <select id="f-category"><option value="">全部分類</option></select>
      <select id="f-function"><option value="">全部功能</option></select>
      <select id="f-scenario"><option value="">全部使用情境</option></select>
      <select id="f-agent"><option value="">全部 agent</option></select>
      <select id="f-status"><option value="">全部狀態</option></select>
    </div>
    <div class="tools">
      <button class="btn primary" id="t-add" type="button">＋ 新增技能</button>
      <button class="btn" id="t-cats" type="button">管理分類</button>
      <button class="btn" id="t-auto" type="button">一鍵自動分類</button>
      <button class="btn" id="t-saves" type="button">我的存檔</button>
      <span id="t-state"></span>
    </div>
    <div id="notice"></div>
    <div id="notice2"></div>
    <div class="active-filters" id="count"></div>
  </div>
  <section id="view"></section>
</main>
<footer>
  技能有新增、更新、暫停或移除時，所有 agent 依 <a href="UPDATE_RULES.md">更新原則</a> 即時更新本目錄。你自己的編輯只存在這個瀏覽器（可在「我的存檔」匯出成檔案備份），不會改到公開的官方目錄。英文名標「建議」者，表示原技能只有中文名稱。
</footer>

<dialog id="dlg2">
  <div class="dlg-head">
    <h3 id="m-title" style="margin:0"></h3>
    <button class="btn" id="m-close" type="button">關閉</button>
  </div>
  <div class="dlg-body" id="m-body"></div>
</dialog>

<dialog id="dlg">
  <div class="dlg-head">
    <div><h3 id="d-title" style="margin:0"></h3><div class="en" id="d-en"></div></div>
    <div style="display:flex;gap:6px">
      <button class="btn" id="d-edit" type="button">編輯</button>
      <button class="btn" id="d-copy" type="button">複製連結</button>
      <button class="btn" id="d-close" type="button">關閉</button>
    </div>
  </div>
  <div class="dlg-body" id="d-body"></div>
</dialog>

<button id="toTop" type="button" aria-label="回到頁面頂端">↑ 回頁頂</button>
<script>
(() => {
  const VIEWS = [
    ["cards","卡片"],["table","表格"],["byCategory","分類索引"],["byFunction","功能索引"],
    ["byScenario","使用情境索引"],["byAudience","對象索引"],["finder","我想要…"],
    ["matrix","Agent 對照"],["names","中英名稱對照"],["log","更新紀錄"]
  ];
  const FINDER = [
    ["出一份學習單","Word 學習單"],["整理教材","Word 教材"],["做簡報","簡報"],["畫圖或漫畫","圖片／漫畫生成"],
    ["課堂互動遊戲","課堂互動遊戲"],["考前準備","期中期末考前"],["特教課","社會技巧課"],["開工／收工","日誌同步"],["整理電腦","電腦維護"]
  ];
  let DATA = null, LOG = [], state = { q:"", view:"cards", category:"", function:"", scenario:"", agent:"", status:"", sort:"category" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // 把已跳脫的文字裡的 http(s) 網址變成可點連結（只用在備註，遇到中文或空白就結束）
  const linkify = t => esc(t).replace(/https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  const agentLabel = k => (DATA.agents[k] && DATA.agents[k].label) || k;

  function store(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
  function load(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }

  function readHash(){
    const p = new URLSearchParams(location.hash.slice(1));
    for (const k of ["q","view","category","function","scenario","agent","status"]) if (p.has(k)) state[k] = p.get(k);
    return p.get("skill");
  }
  function writeHash(skill){
    const p = new URLSearchParams();
    for (const k of ["q","category","function","scenario","agent","status"]) if (state[k]) p.set(k, state[k]);
    if (state.view !== "cards") p.set("view", state.view);
    if (skill) p.set("skill", skill);
    history.replaceState(null, "", p.toString() ? "#" + p.toString() : location.pathname);
  }

  function haystack(s){
    return [s.zh, s.en, s.id, s.category, s.purpose, s.when, s.effect, s.audience, s.notes,
      ...(s.functions||[]), ...(s.scenarios||[]), ...(s.triggers||[]),
      ...(s.agents||[]).flatMap(a => [a.name, agentLabel(a.agent), a.note])].join(" ").toLowerCase();
  }
  function filtered(){
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return DATA.skills.filter(s =>
      (!state.category || s.category === state.category) &&
      (!state.function || (s.functions||[]).includes(state.function)) &&
      (!state.scenario || (s.scenarios||[]).includes(state.scenario)) &&
      (!state.agent || (s.agents||[]).some(a => a.agent === state.agent)) &&
      (!state.status || s.status === state.status || (s.agents||[]).some(a => a.status === state.status)) &&
      terms.every(t => s._hay.includes(t)));
  }
  const uniq = arr => [...new Set(arr)].sort((a,b) => a.localeCompare(b, "zh-Hant"));

  function fillSelect(id, values, labelFn){
    const el = $(id); const keep = el.options[0].outerHTML;
    el.innerHTML = keep + values.map(v => `<option value="${esc(v)}">${esc(labelFn ? labelFn(v) : v)}</option>`).join("");
  }

  function chips(list, kind){
    return (list||[]).map(v => `<span class="chip" data-filter="${kind}" data-value="${esc(v)}">${esc(v)}</span>`).join("");
  }
  function agentChips(s){
    const seen = new Set();
    return (s.agents||[]).filter(a => !seen.has(a.agent) && seen.add(a.agent))
      .map(a => `<span class="chip agent" data-filter="agent" data-value="${esc(a.agent)}">${esc(agentLabel(a.agent))}</span>`).join("");
  }
  const badge = st => `<span class="badge st-${esc(st)}">${esc(st)}</span>`;

  function card(s){
    return `<article class="card" data-skill="${esc(s.id)}">
      <div style="display:flex;justify-content:space-between;gap:6px"><h3>${esc(s.zh)}</h3>${badge(s.status)}</div>
      <div class="en">${esc(s.en)}${s.enNote ? "（建議）" : ""}</div>
      <p>${esc(s.purpose)}</p>
      <p class="muted"><b>使用時機：</b>${esc(s.when)}</p>
      <div>${agentChips(s)}</div>
      <div>${chips(s.functions,"function")}${chips(s.scenarios,"scenario")}</div>
    </article>`;
  }

  function groupBy(list, keyFn){
    const m = new Map();
    for (const s of list) for (const k of [].concat(keyFn(s))) { if (!m.has(k)) m.set(k, []); m.get(k).push(s); }
    return m;
  }
  function groupsView(list, keyFn, order){
    const m = groupBy(list, keyFn);
    const keys = order ? order.filter(k => m.has(k)).concat([...m.keys()].filter(k => !order.includes(k))) : uniq([...m.keys()]);
    if (!keys.length) return empty();
    return keys.map(k => `<div class="group"><h2>${esc(k)}（${m.get(k).length}）</h2><ul>${
      m.get(k).map(s => `<li data-skill="${esc(s.id)}"><b>${esc(s.zh)}</b> <span class="en">${esc(s.en)}</span> — ${esc(s.purpose)}</li>`).join("")
    }</ul></div>`).join("");
  }
  const empty = () => `<div class="empty">找不到符合的技能，換個關鍵字或清除篩選試試。</div>`;

  function sortList(list){
    const by = state.sort;
    const cats = DATA.categories;
    return [...list].sort((a,b) => {
      if (by === "category") return (cats.indexOf(a.category) - cats.indexOf(b.category)) || a.zh.localeCompare(b.zh,"zh-Hant");
      if (by === "en") return a.en.localeCompare(b.en);
      if (by === "updated") return (b.updated||"").localeCompare(a.updated||"");
      if (by === "agents") return b.agents.length - a.agents.length;
      return a.zh.localeCompare(b.zh, "zh-Hant");
    });
  }

  function render(){
    const list = sortList(filtered());
    $("#count").textContent = `符合 ${list.length} ／ 共 ${DATA.skills.length} 個技能` +
      (["category","function","scenario","agent","status"].some(k => state[k]) || state.q ? "（已套用篩選）" : "");
    for (const [k,id] of [["category","#f-category"],["function","#f-function"],["scenario","#f-scenario"],["agent","#f-agent"],["status","#f-status"]]) $(id).value = state[k];
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === state.view));
    const v = $("#view");
    switch (state.view) {
      case "cards": v.innerHTML = list.length ? `<div class="grid">${list.map(card).join("")}</div>` : empty(); break;
      case "table": v.innerHTML = list.length ? `<div class="table-wrap"><table><thead><tr>
          <th data-sort="zh">中文名稱</th><th data-sort="en">英文名稱</th><th data-sort="category">分類</th>
          <th>用途</th><th>對象</th><th data-sort="agents">誰有</th><th>狀態</th><th data-sort="updated">更新</th></tr></thead><tbody>${
          list.map(s => `<tr data-skill="${esc(s.id)}"><td><b>${esc(s.zh)}</b></td><td class="en">${esc(s.en)}</td><td>${esc(s.category)}</td>
          <td>${esc(s.purpose)}</td><td>${esc(s.audience)}</td><td>${agentChips(s)}</td><td>${badge(s.status)}</td><td>${esc(s.updated)}</td></tr>`).join("")
        }</tbody></table></div><p class="muted">點欄位標題可排序。</p>` : empty(); break;
      case "byCategory": v.innerHTML = groupsView(list, s => s.category, DATA.categories); break;
      case "byFunction": v.innerHTML = groupsView(list, s => s.functions); break;
      case "byScenario": v.innerHTML = groupsView(list, s => s.scenarios); break;
      case "byAudience": v.innerHTML = groupsView(list, s => s.audience.split(/[；;]/).map(x => x.trim()).filter(Boolean)); break;
      case "finder": v.innerHTML = `<p class="muted">不知道技能叫什麼？從想做的事開始選。</p><div class="finder">${
          FINDER.map(([label, val]) => {
            const kind = DATA.skills.some(s => (s.functions||[]).includes(val)) ? "function" : "scenario";
            const n = DATA.skills.filter(s => (s[kind === "function" ? "functions" : "scenarios"]||[]).includes(val)).length;
            return `<button type="button" data-filter="${kind}" data-value="${esc(val)}" data-goto="cards"><b>${esc(label)}</b><span class="muted">${n} 個技能</span></button>`;
          }).join("")}</div>`; break;
      case "matrix": {
        const keys = Object.keys(DATA.agents);
        v.innerHTML = list.length ? `<div class="table-wrap"><table class="matrix"><thead><tr><th>技能</th>${keys.map(k => `<th>${esc(agentLabel(k))}</th>`).join("")}</tr></thead><tbody>${
          list.map(s => `<tr data-skill="${esc(s.id)}"><td><b>${esc(s.zh)}</b></td>${keys.map(k => {
            const vs = s.agents.filter(a => a.agent === k);
            return `<td>${vs.map(a => a.status === "啟用" ? "✓" : esc(a.status)).join(" / ")}</td>`;
          }).join("")}</tr>`).join("")
        }</tbody></table></div><p class="muted">✓＝可用；其他文字為該版本的狀態。各 agent 的版本名稱點技能可看。</p>` : empty(); break;
      }
      case "names": v.innerHTML = list.length ? `<div class="table-wrap"><table><thead><tr><th>中文名稱</th><th>英文名稱</th><th>各 agent 裡的名稱</th></tr></thead><tbody>${
          list.map(s => `<tr data-skill="${esc(s.id)}"><td><b>${esc(s.zh)}</b></td><td class="en">${esc(s.en)}${s.enNote ? "（建議）" : ""}</td><td>${
            s.agents.map(a => `${esc(agentLabel(a.agent))}：${esc(a.name)}`).join("<br>")}</td></tr>`).join("")
        }</tbody></table></div>` : empty(); break;
      case "log": v.innerHTML = LOG.length ? `<div class="table-wrap"><table><thead><tr><th>日期</th><th>動作</th><th>agent</th><th>內容</th></tr></thead><tbody>${
          LOG.map(e => `<tr><td>${esc(e.date)}</td><td>${esc(e.action)}</td><td>${esc(e.agent)}</td><td>${esc(e.summary)}${

  /* ===== 我的版本：編輯、分類管理、存檔、一鍵自動分類 ===== */
  const KEY_WORK = "skillcat.work.v1", KEY_SAVES = "skillcat.saves.v1";
  const UNSORTED = "未分類";
  // 各分類的預設關鍵字：一鍵自動分類會拿技能的名稱、功能、情境、觸發詞、用途去比對。可在「管理分類」改。
  const DEFAULT_KW = {
    "國語生字與語詞學習單": ["生字","語詞","形近字","多音字","注音","描寫","習寫","錯別字","國字","部件","字詞","詞卡"],
    "成語教學": ["成語"],
    "造句教學": ["造句","句型"],
    "考試與題庫": ["考試","試卷","題庫","期中","期末","命題","複習","評量","看板"],
    "特教：社會技巧、溝通訓練與 IEP": ["特教","特需","社會技巧","溝通訓練","IEP","資源班"],
    "簡報製作": ["簡報","投影片","slides","ppt","deck"],
    "互動測驗平台": ["Kahoot","Wordwall","Wayground","測驗平台","互動測驗","出題"],
    "貼圖與生活": ["貼圖","家庭","寵物","旅遊","日曆","寫作風格","公文","信件"],
    "工作流程與電腦維護": ["開工","收工","同步","日誌","交接","電腦","系統","更新","清理","軟體","Windows","維護","專案","檔案整理"],
    "圖片生成": ["生圖","影片","圖片生成","AI 圖","Colab","Gemini"]
  };
  const FIELD_W = [["zh",3],["functions",3],["scenarios",3],["triggers",2],["en",1],["audience",1],["purpose",1],["when",1],["effect",1]];
  const MIN_SCORE = 3;

  let OFFICIAL = null;
  let META = { kw:{}, deleted:[], edited:[], base:"", name:"官方版" };
  const clone = o => JSON.parse(JSON.stringify(o));
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const splitList = t => String(t||"").split(/[、,，;；\n]+/).map(x => x.trim()).filter(Boolean);
  const joinList = a => (a||[]).join("、");
  const readJSON = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };

  function snapshot(){
    return { app:"agent-skill-catalog", v:1, name:META.name, base:META.base, kw:META.kw, deleted:META.deleted, edited:META.edited,
      categories:DATA.categories.slice(), skills:DATA.skills.map(s => { const c = {...s}; delete c._hay; return clone(c); }), savedAt:new Date().toISOString() };
  }
  function persist(noDirty){ store(KEY_WORK, JSON.stringify(snapshot())); if (noDirty !== true) { const c = syncCfg(); if (c.token) { c.dirty = true; saveCfg(c); scheduleAutoPush(); } } updateState(); }
  function useWork(w){
    META = { kw:w.kw||{}, deleted:w.deleted||[], edited:w.edited||[], base:w.base||OFFICIAL.updated, name:w.name||"我的版本" };
    DATA = { agents:OFFICIAL.agents, updated:OFFICIAL.updated, categories:w.categories.slice(), skills:clone(w.skills) };
    for (const s of DATA.skills) for (const c of ["functions","scenarios","triggers","agents"]) if (!Array.isArray(s[c])) s[c] = [];
    for (const c of DATA.skills.map(s => s.category)) if (c && !DATA.categories.includes(c)) DATA.categories.push(c);
  }
  function officialWork(){
    return { name:"官方版", base:OFFICIAL.updated, kw:{}, deleted:[], edited:[], categories:OFFICIAL.categories.slice(), skills:clone(OFFICIAL.skills) };
  }
  function validWork(w){ return w && Array.isArray(w.skills) && Array.isArray(w.categories) && w.skills.every(s => s && s.id && s.zh); }
  function startWork(){
    const w = readJSON(KEY_WORK);
    useWork(validWork(w) ? w : officialWork());
  }
  function kwOf(cat){ return META.kw[cat] || DEFAULT_KW[cat] || []; }

  function rebuildUI(){
    DATA.skills.forEach(s => s._hay = haystack(s));
    $("#updated").textContent = DATA.updated;
    const versions = DATA.skills.reduce((n,s) => n + (s.agents||[]).length, 0);
    const paused = DATA.skills.filter(s => s.status !== "啟用").length;
    $("#stats").innerHTML = `<div class="stat"><b>${DATA.skills.length}</b> 個技能</div><div class="stat"><b>${versions}</b> 個 agent 版本</div>` +
      `<div class="stat"><b>${DATA.categories.length}</b> 個分類</div><div class="stat"><b>${paused}</b> 個非啟用</div>`;
    fillSelect("#f-category", DATA.categories);
    fillSelect("#f-function", uniq(DATA.skills.flatMap(s => s.functions||[])));
    fillSelect("#f-scenario", uniq(DATA.skills.flatMap(s => s.scenarios||[])));
    fillSelect("#f-agent", Object.keys(DATA.agents), agentLabel);
    fillSelect("#f-status", uniq(DATA.skills.flatMap(s => [s.status, ...(s.agents||[]).map(a => a.status)])));
    for (const k of ["category","function","scenario","agent","status"]) {
      const sel = $("#f-" + k); if (state[k] && ![...sel.options].some(o => o.value === state[k])) state[k] = "";
    }
    updateState();
  }
  function changed(){ persist(); rebuildUI(); render(); }
  function updateState(){
    const official = JSON.stringify([DATA.categories, DATA.skills.map(s => { const c = {...s}; delete c._hay; return c; })]) ===
      JSON.stringify([OFFICIAL.categories, OFFICIAL.skills]);
    $("#t-state").textContent = official ? "目前：官方版" : `目前：${META.name === "官方版" ? "我的版本" : META.name}（已存在這個瀏覽器）`;
    if (syncMsg) $("#t-state").textContent += "　" + syncMsg;
    const pm = pendingMerge(), newer = pm.add.length + pm.upd.length > 0;
    $("#notice").innerHTML = newer ? `<div class="note">官方目錄有更新：${pm.add.length} 個新技能、${pm.upd.length} 個你沒改過的技能有新內容。<button class="btn small" id="n-merge" type="button">併入新技能與未改過的更新</button></div>` : "";
    const b = $("#n-merge"); if (b) b.addEventListener("click", mergeOfficial);
  }
  // 官方有哪些技能是你的版本沒有的（新增），或你沒改過但官方內容不同的（更新）。你改過的技能一律不動。
  function pendingMerge(){
    const add = [], upd = [];
    const strip = x => { const c = {...x}; delete c._hay; delete c.category; return JSON.stringify(c); };
    for (const o of OFFICIAL.skills) {
      if (META.deleted.includes(o.id)) continue;
      const mine = DATA.skills.find(s => s.id === o.id);
      if (!mine) add.push(o);
      else if (!META.edited.includes(o.id) && strip(mine) !== strip(o)) upd.push(o);
    }
    return { add, upd };
  }
  // 官方的分類如果你已改名或刪除，就依你現有分類的關鍵字重新歸位，找不到線索再放「未分類」
  function fitCategory(sk){
    if (DATA.categories.includes(sk.category)) return sk;
    const best = classify(sk);
    sk.category = best.score >= MIN_SCORE ? best.cat : UNSORTED;
    if (!DATA.categories.includes(sk.category)) DATA.categories.push(sk.category);
    return sk;
  }
  function mergeOfficial(){
    const { add, upd } = pendingMerge();
    for (const o of add) DATA.skills.push(fitCategory(clone(o)));
    for (const o of upd) { const i = DATA.skills.findIndex(s => s.id === o.id); const n = clone(o); n.category = DATA.skills[i].category; DATA.skills[i] = n; }
    META.base = OFFICIAL.updated; changed();
    modal("已併入官方更新", `<p>新增 ${add.length} 個技能（${add.map(o => esc(o.zh)).join("、") || "無"}），更新 ${upd.length} 個沒改過的技能。你改過的技能都保留原樣。</p>`);
  }

  /* ----- 通用彈窗 ----- */

  const catOptions = sel => DATA.categories.map(c => `<option${c === sel ? " selected" : ""}>${esc(c)}</option>`).join("");
  const dl = (name, text) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:"application/json"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };

  /* ----- 編輯／新增技能 ----- */
  function editSkill(id){
    const s = id ? DATA.skills.find(x => x.id === id) : { id:"", zh:"", en:"", category:state.category || DATA.categories[0] || UNSORTED, functions:[], scenarios:[], triggers:[], purpose:"", when:"", effect:"", audience:"", notes:"", status:"啟用", agents:[] };
    if (!s) return;

    modal(id ? "編輯技能" : "新增技能", `<form class="form" id="f-edit" autocomplete="off">
      ${f("中文名稱","zh",s.zh)}${f("英文名稱（或原本的代號）","en",s.en)}
      <label>分類</label><select name="category">${catOptions(s.category)}</select>
      <label>狀態</label><select name="status">${["啟用","暫停","待確認","已移除"].map(x => `<option${x === s.status ? " selected" : ""}>${x}</option>`).join("")}</select>
      ${f("功能","functions",joinList(s.functions),"用「、」分開，例：Word 學習單、簡報")}
      ${f("使用情境","scenarios",joinList(s.scenarios),"用「、」分開")}
      ${f("用途","purpose",s.purpose,"",1)}${f("使用時機","when",s.when,"",1)}${f("產出（會有什麼效果）","effect",s.effect,"",1)}
      ${f("對象","audience",s.audience)}${f("觸發詞","triggers",joinList(s.triggers),"你會怎麼叫它，用「、」分開")}
      ${f("備註","notes",s.notes||"","",1)}
      <div class="row-actions"><span>${id ? `<button class="btn danger" type="button" id="e-del">刪除這個技能</button>` : ""}</span>
        <span><button class="btn" type="button" id="e-cancel">取消</button> <button class="btn primary" type="submit">儲存</button></span></div>
    </form>`);
    $("#e-cancel").addEventListener("click", closeModal);
    if (id) $("#e-del").addEventListener("click", () => {
      if (!confirm(`確定要刪除「${s.zh}」嗎？（只刪你的版本，官方目錄不受影響；可在「我的存檔」還原。）`)) return;
      DATA.skills = DATA.skills.filter(x => x.id !== id);
      DATA.skills.forEach(x => { if (x.related) x.related = x.related.filter(r => r !== id); });
      if (!META.deleted.includes(id) && OFFICIAL.skills.some(o => o.id === id)) META.deleted.push(id);
      closeModal(); if ($("#dlg").open) $("#dlg").close(); changed();
    });
    $("#f-edit").addEventListener("submit", e => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(e.target).entries());
      if (!v.zh.trim()) { alert("中文名稱不能空白"); return; }
      const out = { ...s, zh:v.zh.trim(), en:v.en.trim() || v.zh.trim(), category:v.category, status:v.status,
        functions:splitList(v.functions), scenarios:splitList(v.scenarios), triggers:splitList(v.triggers),
        purpose:v.purpose.trim(), when:v.when.trim(), effect:v.effect.trim(), audience:v.audience.trim(), notes:v.notes.trim(), updated:today() };
      if (!out.notes) delete out.notes;
      if (s.enNote && out.en !== s.en) delete out.enNote;
      if (id) { DATA.skills[DATA.skills.findIndex(x => x.id === id)] = out; }
      else { out.id = "my-" + Date.now().toString(36); DATA.skills.push(out); }
      if (!META.edited.includes(out.id)) META.edited.push(out.id);
      closeModal(); changed();
      if ($("#dlg").open) openSkill(out.id);
    });
  }

  /* ----- 管理分類 ----- */
  function manageCats(){
    let draft = DATA.categories.map(c => ({ old:c, name:c, kw:joinList(kwOf(c)), del:false }));
    const count = c => DATA.skills.filter(s => s.category === c).length;
    const draw = () => {
      $("#m-body").innerHTML = `<p class="muted">改名會同步改到該分類的所有技能；「關鍵字」是一鍵自動分類用來比對的字。刪除分類時，裡面的技能會移到「${UNSORTED}」。</p>` +
        draft.map((d,i) => `<div class="cat-row${d.del ? " del" : ""}" data-i="${i}">
          <input class="m-input" data-f="name" value="${esc(d.name)}" aria-label="分類名稱">
          <input class="m-input" data-f="kw" value="${esc(d.kw)}" placeholder="關鍵字，用「、」分開" aria-label="關鍵字">
          <span><button class="btn small" data-a="up" type="button">↑</button> <button class="btn small" data-a="down" type="button">↓</button> <button class="btn small danger" data-a="del" type="button">${d.del ? "復原" : "刪除"}</button></span>
          <div class="cnt">${d.old ? `原有 ${count(d.old)} 個技能` : "新分類"}</div></div>`).join("") +
        `<div class="row-actions"><button class="btn" type="button" id="c-add">＋ 新增分類</button>
          <span><button class="btn" type="button" id="c-cancel">取消</button> <button class="btn primary" type="button" id="c-ok">套用</button></span></div>`;
      $("#m-body").querySelectorAll(".cat-row").forEach(row => {
        const i = +row.dataset.i;
        row.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => { draft[i][inp.dataset.f] = inp.value; }));
        row.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
          const a = b.dataset.a;
          if (a === "del") draft[i].del = !draft[i].del;
          else { const j = a === "up" ? i - 1 : i + 1; if (j < 0 || j >= draft.length) return; [draft[i], draft[j]] = [draft[j], draft[i]]; }
          draw();
        }));
      });
      $("#c-add").addEventListener("click", () => { draft.push({ old:"", name:"新分類", kw:"", del:false }); draw(); });
      $("#c-cancel").addEventListener("click", closeModal);
      $("#c-ok").addEventListener("click", apply);
    };
    const apply = () => {
      const live = draft.filter(d => !d.del);
      const names = live.map(d => d.name.trim());
      if (names.some(n => !n)) { alert("分類名稱不能空白"); return; }
      if (new Set(names).size !== names.length) { alert("有重複的分類名稱"); return; }
      const rename = new Map(live.filter(d => d.old).map(d => [d.old, d.name.trim()]));
      const gone = draft.filter(d => d.del && d.old).map(d => d.old);
      let orphan = false;
      for (const s of DATA.skills) {
        if (rename.has(s.category)) { if (rename.get(s.category) !== s.category) { s.category = rename.get(s.category); markEdited(s.id); } }
        else if (gone.includes(s.category) || !names.includes(s.category)) { s.category = UNSORTED; orphan = true; markEdited(s.id); }
      }
      const kw = {};
      for (const d of live) kw[d.name.trim()] = splitList(d.kw);
      META.kw = kw;
      DATA.categories = names.slice();
      if (orphan && !DATA.categories.includes(UNSORTED)) DATA.categories.push(UNSORTED);
      closeModal(); changed();
    };
    modal("管理分類", ""); draw();
  }
  const markEdited = id => { if (!META.edited.includes(id)) META.edited.push(id); };

  /* ----- 一鍵自動分類 ----- */
  function classify(s){
    const scores = DATA.categories.filter(c => c !== UNSORTED).map(c => {
      const words = [...new Set([c, ...kwOf(c)].map(w => w.toLowerCase()).filter(w => w.length >= 1))];
      // 分類名稱本身通常很長（例：特教：社會技巧…），只拿它切出來的片段比對，避免整串永遠對不上
      const nameParts = c.split(/[：:、，,／/與和及\s]+/).map(x => x.trim().toLowerCase()).filter(x => x.length >= 2);
      const all = [...new Set([...words, ...nameParts])];
      let score = 0;
      for (const [field, w] of FIELD_W) {
        const text = [].concat(s[field] ?? "").join(" ").toLowerCase();
        for (const word of all) if (text.includes(word)) score += w;
      }
      return { cat:c, score };
    });
    scores.sort((a,b) => b.score - a.score || (b.cat === s.category) - (a.cat === s.category));
    return scores[0] || { cat:s.category, score:0 };
  }
  function autoClassify(){
    const moves = [], keep = [];
    for (const s of DATA.skills) {
      const best = classify(s);
      if (best.score < MIN_SCORE) { keep.push({ s, why:"找不到足夠線索，維持原分類" }); continue; }
      if (best.cat !== s.category) moves.push({ s, to:best.cat, score:best.score });
    }
    const body = moves.length
      ? `<p class="muted">依每個技能的名稱、功能、情境、觸發詞與用途，跟各分類的關鍵字比對（可在「管理分類」調整關鍵字）。取消勾選的技能不會移動。</p>` +
        moves.map((m,i) => `<label class="move-row"><input type="checkbox" checked data-i="${i}"><span><b>${esc(m.s.zh)}</b><br><span class="muted">${esc(m.s.category)}</span> <span class="arrow">→</span> <b>${esc(m.to)}</b></span></label>`).join("")
      : `<p>每個技能都已經在最符合的分類裡，沒有需要移動的。</p>`;
    modal("一鍵自動分類", body + (keep.length ? `<p class="muted" style="margin-top:12px">另有 ${keep.length} 個技能找不到足夠線索，維持原樣：${keep.map(k => esc(k.s.zh)).join("、")}。</p>` : "") +
      `<div class="row-actions"><span></span><span><button class="btn" type="button" id="a-cancel">取消</button>${moves.length ? ` <button class="btn primary" type="button" id="a-ok">套用勾選的 ${moves.length} 項</button>` : ""}</span></div>`);
    $("#a-cancel").addEventListener("click", closeModal);
    if (moves.length) $("#a-ok").addEventListener("click", () => {
      let n = 0;
      $("#m-body").querySelectorAll("input[type=checkbox]").forEach(c => {
        if (!c.checked) return; const m = moves[+c.dataset.i]; m.s.category = m.to; m.s.updated = today(); markEdited(m.s.id); n++;
      });
      closeModal(); changed();
    });
  }

  /* ----- 我的存檔 ----- */
  function savesDialog(){
    const saves = readJSON(KEY_SAVES) || {};
    const names = Object.keys(saves).sort((a,b) => (saves[b].savedAt||"").localeCompare(saves[a].savedAt||""));
    modal("我的存檔", `<p class="muted">你的修改會自動留在這個瀏覽器。想保留不同版本、換電腦或防萬一，就存成存檔或匯出檔案。</p>
      <label class="muted">存檔名稱</label>
      <div style="display:flex;gap:6px"><input class="m-input" id="s-name" value="${esc(META.name === "官方版" ? "我的存檔" : META.name)}"><button class="btn primary" id="s-save" type="button">存成存檔</button></div>
      <div style="margin-top:14px">${names.length ? names.map(n => `<div class="save-row"><span><b>${esc(n)}</b><br><span class="muted">${esc((saves[n].savedAt||"").slice(0,16).replace("T"," "))}・${saves[n].skills.length} 個技能</span></span>
        <span><button class="btn small" data-n="${esc(n)}" data-a="load" type="button">載入</button> <button class="btn small" data-n="${esc(n)}" data-a="dl" type="button">下載</button> <button class="btn small danger" data-n="${esc(n)}" data-a="rm" type="button">刪除</button></span></div>`).join("") : `<p class="muted">還沒有存檔。</p>`}</div>
      ${syncSectionHtml()}
      <div class="row-actions"><span><button class="btn" id="s-export" type="button">匯出目前版本</button> <label class="btn" style="margin:0;display:inline-block;font-weight:normal;color:inherit">匯入檔案<input type="file" id="s-import" accept=".json,application/json" hidden></label></span>
        <button class="btn danger" id="s-reset" type="button">還原成官方版</button></div>`);
    $("#s-save").addEventListener("click", () => {
      const name = $("#s-name").value.trim(); if (!name) return;
      if (saves[name] && !confirm(`已有「${name}」存檔，要覆蓋嗎？`)) return;
      META.name = name; const snap = snapshot(); saves[name] = snap;
      store(KEY_SAVES, JSON.stringify(saves)); persist(); savesDialog();
    });
    $("#m-body").querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => {
      const n = b.dataset.n, a = b.dataset.a;
      if (a === "load") { if (!confirm(`載入「${n}」會取代目前畫面上的版本（目前版本會先自動備份成「載入前備份」）。繼續嗎？`)) return;
        saves["載入前備份"] = snapshot(); store(KEY_SAVES, JSON.stringify(saves)); useWork(saves[n]); META.name = n; closeModal(); changed(); }
      if (a === "dl") dl(`技能目錄-${n}.json`, JSON.stringify(saves[n], null, 1));
      if (a === "rm") { if (!confirm(`刪除存檔「${n}」？`)) return; delete saves[n]; store(KEY_SAVES, JSON.stringify(saves)); savesDialog(); }
    }));
    $("#s-export").addEventListener("click", () => dl(`技能目錄-${META.name}-${today()}.json`, JSON.stringify(snapshot(), null, 1)));
    $("#s-import").addEventListener("change", async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const w = JSON.parse(await file.text());
        if (!validWork(w)) throw new Error("格式不對");
        saves["載入前備份"] = snapshot(); store(KEY_SAVES, JSON.stringify(saves));
        useWork(w); META.name = w.name || file.name.replace(/\.json$/i,""); closeModal(); changed();
      } catch (err) { alert("這個檔案不是技能目錄的存檔：" + err.message); }
    });
    bindSync();
    $("#s-reset").addEventListener("click", () => {
      if (!confirm("還原成官方版？目前版本會先備份成「還原前備份」存檔。")) return;
      saves["還原前備份"] = snapshot(); store(KEY_SAVES, JSON.stringify(saves));
      useWork(officialWork()); closeModal(); changed();
    });
  }

  /* ----- 雲端同步（寫到 GitHub repo 的一個 JSON 檔，各台電腦讀同一份）----- */
  const KEY_SYNC = "skillcat.sync.v1";
  const syncCfg = () => Object.assign({ token:"", repo:"andice0107/agent-skill-catalog", path:"data/my-version.json", last:"", dirty:false }, readJSON(KEY_SYNC) || {});
  const saveCfg = c => store(KEY_SYNC, JSON.stringify(c));
  let syncMsg = "", pushTimer = null;
  const b64enc = t => { const b = new TextEncoder().encode(t); let s = ""; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode(...b.subarray(i, i + 8192)); return btoa(s); };
  const b64dec = t => { const s = atob(t.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0))); };
  const ghUrl = c => `https://api.github.com/repos/${c.repo}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`;
  const ghHead = c => ({ "Authorization":"Bearer " + c.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" });
  async function ghGet(c){
    const r = await fetch(ghUrl(c) + "?t=" + Date.now(), { headers:ghHead(c), cache:"no-store" });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(r.status === 401 ? "金鑰無效或已過期" : r.status === 403 ? "金鑰沒有這個 repo 的權限" : "GitHub 回應 " + r.status);
    const j = await r.json();
    return { sha:j.sha, work:JSON.parse(b64dec(j.content)) };
  }
  async function ghPut(c, work, sha){
    const body = { message:"同步我的技能目錄版本 " + work.savedAt, content:b64enc(JSON.stringify(work, null, 1)) };
    if (sha) body.sha = sha;
    const r = await fetch(ghUrl(c), { method:"PUT", headers:{ ...ghHead(c), "Content-Type":"application/json" }, body:JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status === 403 || r.status === 404 ? "金鑰沒有寫入權限（要 Contents: Read and write）" : r.status === 409 || r.status === 422 ? "雲端剛被另一台改過，請再試一次" : "GitHub 回應 " + r.status);
  }
  function setSync(msg){ syncMsg = msg; updateState(); }
  function scheduleAutoPush(){
    if (!syncCfg().token) return;
    clearTimeout(pushTimer); pushTimer = setTimeout(() => pushCloud(false), 3000);
  }
  async function pushCloud(manual){
    const c = syncCfg(); if (!c.token) return;
    setSync("☁ 同步中…");
    try {
      const cur = await ghGet(c);
      if (cur && cur.work.savedAt !== c.last) {
        if (!manual) { setSync("☁ 雲端有另一台電腦的新版本，請到「我的存檔」選擇"); showSyncConflict(cur.work); return; }
        if (!confirm("雲端版本比這台電腦上次同步的更新（可能是另一台電腦改的）。要用這台的版本覆蓋嗎？")) { setSync(""); return; }
      }
      const w = snapshot(); await ghPut(c, w, cur && cur.sha);
      c.last = w.savedAt; c.dirty = false; saveCfg(c); setSync("☁ 已同步 " + new Date().toTimeString().slice(0,5));
    } catch (e) { setSync("☁ 同步失敗：" + e.message); if (manual) alert("同步失敗：" + e.message); }
  }
  function loadCloudWork(w, why){
    const saves = readJSON(KEY_SAVES) || {}; saves["雲端載入前備份"] = snapshot(); store(KEY_SAVES, JSON.stringify(saves));
    useWork(w); const c = syncCfg(); c.last = w.savedAt; c.dirty = false; saveCfg(c);
    persist(true); rebuildUI(); render(); setSync("☁ " + why);
  }
  async function pullCloud(){
    const c = syncCfg(); if (!c.token) return;
    setSync("☁ 讀取中…");
    try {
      const cur = await ghGet(c);
      if (!cur) { setSync("☁ 雲端還沒有存檔，先在原本那台按「立即上傳」"); return; }
      if (!validWork(cur.work)) throw new Error("雲端檔案格式不對");
      loadCloudWork(cur.work, "已載入雲端版本");
    } catch (e) { setSync("☁ 讀取失敗：" + e.message); }
  }
  function showSyncConflict(w){
    $("#notice2").innerHTML = `<div class="note">雲端有另一台電腦存的版本（${esc((w.savedAt||"").slice(0,16).replace("T"," "))}），這台也有沒上傳的修改。
      <button class="btn small" id="sc-pull" type="button">載入雲端版（這台目前的先備份）</button>
      <button class="btn small" id="sc-push" type="button">用這台的覆蓋雲端</button></div>`;
    $("#sc-pull").addEventListener("click", () => { $("#notice2").innerHTML = ""; loadCloudWork(w, "已載入雲端版本"); });
    $("#sc-push").addEventListener("click", () => { const c = syncCfg(); c.last = w.savedAt; saveCfg(c); $("#notice2").innerHTML = ""; pushCloud(false); });
  }
  async function startSync(){
    const c = syncCfg(); if (!c.token) return;
    setSync("☁ 檢查雲端…");
    try {
      const cur = await ghGet(c);
      if (!cur) { setSync(c.dirty ? "☁ 雲端還沒有存檔" : "☁ 已連線（雲端還沒有存檔）"); if (c.dirty) scheduleAutoPush(); return; }
      if (cur.work.savedAt === c.last) { setSync("☁ 已與雲端同步"); if (c.dirty) scheduleAutoPush(); return; }
      if (!validWork(cur.work)) throw new Error("雲端檔案格式不對");
      if (!c.dirty) { loadCloudWork(cur.work, "已載入雲端最新版（來自另一台電腦）"); return; }
      setSync("☁ 雲端有另一台電腦的新版本"); showSyncConflict(cur.work);
    } catch (e) { setSync("☁ 同步失敗：" + e.message); }
  }
  function syncSectionHtml(){
    const c = syncCfg();
    return `<h4 style="margin:18px 0 4px;color:var(--accent)">☁ 雲端同步（各台電腦看到同一份）</h4>
      <p class="muted" style="margin:0 0 6px">${c.token ? "已設定。你每次修改約 3 秒後會自動上傳；打開網站時會自動讀雲端最新版。" : "設定一次後，修改會自動存到你的 GitHub，其他電腦輸入同一把金鑰就能看到同樣的內容。"}</p>
      <details${c.token ? "" : " open"}><summary class="muted">怎麼取得金鑰？</summary>
        <ol class="muted" style="margin:6px 0;padding-left:20px">
          <li>GitHub → 右上頭像 → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token。</li>
          <li>Repository access 選 <b>Only select repositories</b>，只選 <code>agent-skill-catalog</code>。</li>
          <li>Permissions → Repository permissions → <b>Contents: Read and write</b>，其他都不開。</li>
          <li>Expiration 選你能接受的期限（到期要換新的），建立後複製那串 <code>github_pat_…</code> 貼到下面。</li>
          <li>每台電腦各貼一次。金鑰只存在那台電腦的瀏覽器，不會上傳。</li></ol></details>
      <label class="muted">GitHub 金鑰</label><input class="m-input" id="y-token" type="password" value="${esc(c.token)}" placeholder="github_pat_…" autocomplete="off">
      <label class="muted">存放的 repo</label><input class="m-input" id="y-repo" value="${esc(c.repo)}">
      <label class="muted">檔案路徑</label><input class="m-input" id="y-path" value="${esc(c.path)}">
      <p class="muted" style="margin:4px 0">注意：這個 repo 是公開的，存檔檔案內容（分類與技能敘述）別人也看得到。</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn primary" id="y-save" type="button">儲存設定並同步</button>
        <button class="btn" id="y-push" type="button">立即上傳</button><button class="btn" id="y-pull" type="button">從雲端載入</button>
        <button class="btn danger" id="y-off" type="button">中斷同步</button></div>`;
  }
  function bindSync(){
    const read = () => { const c = syncCfg(); c.token = $("#y-token").value.trim(); c.repo = $("#y-repo").value.trim(); c.path = $("#y-path").value.trim(); return c; };
    $("#y-save").addEventListener("click", async () => {
      const c = read(); if (!c.token || !/^[\w.-]+\/[\w.-]+$/.test(c.repo) || !c.path) { alert("請填金鑰、repo（格式：帳號/名稱）與路徑"); return; }
      saveCfg(c); closeModal();
      try { const cur = await ghGet(c);
        if (!cur) { c.dirty = true; saveCfg(c); await pushCloud(true); }
        else if (confirm("雲端已經有一份存檔。\n按「確定」＝載入雲端那份（這台目前的先備份）；\n按「取消」＝用這台目前的覆蓋雲端。")) { if (!validWork(cur.work)) throw new Error("雲端檔案格式不對"); loadCloudWork(cur.work, "已載入雲端版本"); }
        else { c.last = cur.work.savedAt; saveCfg(c); await pushCloud(true); }
      } catch (e) { setSync("☁ 設定失敗：" + e.message); alert("設定失敗：" + e.message); }
    });
    $("#y-push").addEventListener("click", () => { const c = read(); saveCfg(c); closeModal(); pushCloud(true); });
    $("#y-pull").addEventListener("click", () => { const c = read(); saveCfg(c); closeModal(); pullCloud(); });
    $("#y-off").addEventListener("click", () => { if (!confirm("中斷同步並從這台電腦清除金鑰？（雲端檔案不會刪。）")) return; saveCfg({ ...syncCfg(), token:"", last:"", dirty:false }); setSync(""); closeModal(); });
  }

  function bindTools(){
    $("#t-add").addEventListener("click", () => editSkill(null));
    $("#t-cats").addEventListener("click", manageCats);
    $("#t-auto").addEventListener("click", autoClassify);
    $("#t-saves").addEventListener("click", savesDialog);
    $("#m-close").addEventListener("click", closeModal);
    $("#d-edit").addEventListener("click", () => { const id = new URLSearchParams(location.hash.slice(1)).get("skill"); if (id) editSkill(id); });
  }

  async function init(){
    const t = load("theme"); if (t) document.documentElement.dataset.theme = t;
    try {
      const [skills, log] = await Promise.all([
        fetch("data/skills.json", {cache:"no-store"}).then(r => r.json()),
        fetch("data/changelog.json", {cache:"no-store"}).then(r => r.json()).catch(() => ({entries:[]}))
      ]);
      OFFICIAL = skills; LOG = (log.entries||[]).slice().sort((a,b) => b.date.localeCompare(a.date));
    } catch (err) {
      $("#view").innerHTML = `<div class="empty">讀不到技能資料（data/skills.json）。若直接開本機檔案，請改用網址或本機伺服器開啟。</div>`;
      return;
    }
    startWork();
    $("#tabs").innerHTML = VIEWS.map(([k,l]) => `<button class="tab" role="tab" type="button" data-view="${k}">${l}</button>`).join("");
    document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; render(); }));
    rebuildUI();
    for (const [k,id] of [["category","#f-category"],["function","#f-function"],["scenario","#f-scenario"],["agent","#f-agent"],["status","#f-status"]])
      $(id).addEventListener("change", e => { state[k] = e.target.value; render(); });
    let timer; $("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
    $("#reset").addEventListener("click", () => { Object.assign(state, {q:"",category:"",function:"",scenario:"",agent:"",status:""}); $("#q").value = ""; render(); });
    bindTools();
    $("#theme").addEventListener("click", () => {
      const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#16181b";
      document.documentElement.dataset.theme = dark ? "light" : "dark"; store("theme", document.documentElement.dataset.theme);
    });
    $("#d-close").addEventListener("click", () => $("#dlg").close());
    $("#dlg").addEventListener("close", () => writeHash());
    $("#d-copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); $("#d-copy").textContent = "已複製"; setTimeout(() => $("#d-copy").textContent = "複製連結", 1500); } catch(e) {}
    });
    document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
    const skill = readHash(); $("#q").value = state.q;
    render();
    if (skill) openSkill(skill);
    startSync();
  }
  init();
  const topBtn = document.getElementById('toTop');
  const onScroll = () => topBtn.classList.toggle('show', window.scrollY > 300);
  window.addEventListener('scroll', onScroll, {passive:true});
  topBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
  onScroll();
})();
</script>
</body>
</html>
